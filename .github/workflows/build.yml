name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults

  publish:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-x86]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Pojedynczy plik .exe bez instalacji .NET (decyzje: 1.4, 1.7).
      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/MultiRejestrator.App/MultiRejestrator.App.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -o publish

      - name: Rename
        shell: pwsh
        run: Rename-Item publish/MultiRejestrator.exe "MultiRejestrator-${{ matrix.rid }}.exe"

      - name: Upload application
        uses: actions/upload-artifact@v6
        with:
          name: MultiRejestrator-${{ matrix.rid }}
          path: publish/MultiRejestrator-${{ matrix.rid }}.exe
          if-no-files-found: error

  # Wydanie: tag vX.Y.Z tworzy GitHub Release z oboma plikami .exe (decyzje: numeracja wersji).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: MultiRejestrator-*
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.exe --repo "${GITHUB_REPOSITORY}" --title "MultiRejestrator ${GITHUB_REF_NAME}" --generate-notes
